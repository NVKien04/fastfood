services:
  main-service:
    build:
      context: ./main-service
      dockerfile: Dockerfile
    container_name: fastfood-main-service
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      DB_HOST: postgres-db
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fastfood-network

  postgres-db:
    image: postgres:16-alpine
    container_name: fastfood-postgres-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    env_file:
      - .env.prod
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-fastfood}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fastfood-network

  redis:
    image: redis:7-alpine
    container_name: fastfood-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - fastfood-network

  redis-insight:
    image: redis/redisinsight:latest
    container_name: fastfood-redis-insight
    restart: unless-stopped
    ports:
      - "${REDISINSIGHT_PORT:-5540}:5540"
    volumes:
      - redis_insight_data:/data
    depends_on:
      - redis
    networks:
      - fastfood-network

networks:
  fastfood-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  redis_insight_data: