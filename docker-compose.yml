version: '3.8'

services:
  main-service:
    build:
      context: ./fastfood/main-service
      dockerfile: Dockerfile
    container_name: fastfood-main-service
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    env_file:
      - .env.prod
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres-db
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - fastfood-network

  postgres-db:
    image: postgres:16-alpine
    container_name: fastfood-postgres-db
    restart: unless-stopped
    ports:
      # Chỉ map cổng 5432 về localhost để nâng cao bảo mật, tránh public ra ngoài internet
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    env_file:
      - .env.prod
    environment:
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-fastfood}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fastfood-network

networks:
  fastfood-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
